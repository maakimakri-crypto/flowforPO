<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProjectFlow | Operations</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,Arial;background:#f4f7fb;color:#142238}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;background:#2463eb;color:white;border:0;border-radius:9px;padding:11px 16px;font-weight:650}button:hover{background:#174cc0}input,select,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:10px;width:100%;background:white}label{font-size:12px;color:#516174;display:block;margin:12px 0 5px}.shell{display:flex;min-height:100vh}aside{width:245px;background:#101d35;color:#e5eefa;padding:25px 14px;flex-shrink:0}aside h2{padding:0 12px;margin:0 0 26px}aside button{display:block;background:transparent;width:100%;text-align:left;margin:4px 0;font-weight:500;color:#c9d5e8}aside button.active,aside button:hover{background:#253b60}main{padding:32px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.card,.panel{background:white;border:1px solid #e1e8f2;border-radius:14px;padding:20px;box-shadow:0 3px 10px #10243b08}.card small{color:#64748b}.card strong{display:block;font-size:28px;margin-top:10px}.panel{margin:20px 0;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#63758c;background:#f6f8fc}td,th{padding:13px;border-bottom:1px solid #e7edf5;white-space:nowrap}.muted{color:#64748b}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.notice{padding:12px 16px;border-radius:9px;margin:12px 0;background:#e8f3ff;color:#1e477a}.error{background:#fee2e2;color:#991b1b}.auth{max-width:420px;margin:12vh auto;padding:32px}.tag{background:#e8eefb;border-radius:20px;padding:5px 9px;font-size:11px}.actions{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.actions>*{flex:1;min-width:160px}h1{margin:0;font-size:28px}h3{margin-top:0}@media(max-width:900px){aside{width:180px}.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr 1fr}main{padding:16px}}@media(max-width:600px){.shell{display:block}aside{width:100%;padding:12px;display:flex;overflow:auto;align-items:center}aside h2{font-size:16px;margin:0 12px 0 0}aside button{width:auto;white-space:nowrap}.formgrid,.cards{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}}
</style></head><body><div id="root"></div><script>
let D={},me=null,view='dashboard',notice='';const root=document.getElementById('root');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=x=>Number(x||0);const fmt=x=>n(x).toLocaleString(undefined,{maximumFractionDigits:2});
async function api(url,method='GET',body){let r=await fetch('/api/'+url,{method,headers:body?{'Content-Type':'application/json'}:{},credentials:'same-origin',body:body?JSON.stringify(body):undefined});let x=await r.json();if(!r.ok)throw Error(typeof x.detail==='string'?x.detail:JSON.stringify(x.detail));return x}
function flash(t,bad=false){notice=`<div class="notice ${bad?'error':''}">${esc(t)}</div>`;render()}
async function start(){try{me=await api('me');await refresh()}catch{const s=await api('setup-status');auth(s.needs_setup)}}
function auth(setup){root.innerHTML=`<div class="panel auth"><h1>ProjectFlow</h1><p class="muted">${setup?'Create the initial administrator':'Sign in to your workspace'}</p><form id="authform"><label>Username</label><input name="username" required autocomplete="username"><label>Password</label><input name="password" type="password" required minlength="${setup?12:1}" autocomplete="${setup?'new-password':'current-password'}"><p><button>${setup?'Create administrator':'Sign in'}</button></p></form><div id="autherr"></div></div>`;document.getElementById('authform').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));try{await api(setup?'setup':'login','POST',b);if(setup){auth(false)}else{me=await api('me');await refresh()}}catch(err){document.getElementById('autherr').textContent=err.message}}}
async function refresh(){D=await api('data');render()}
const field=(name,label,type='text',extra='')=>`<div><label>${label}</label><input name="${name}" type="${type}" ${extra} required></div>`;
const choice=(name,label,items,placeholder='Select')=>`<div><label>${label}</label><select name="${name}" required><option value="">${placeholder}</option>${items.map(x=>`<option value="${esc(x.id)}">${esc(x.label)}</option>`).join('')}</select></div>`;
const projects=()=>D.projects.map(x=>({id:x.id,label:x.code+' — '+x.name}));const pos=()=>D.pos.map(x=>({id:x.id,label:x.number+' — '+x.supplier+' (received '+fmt(x.received)+'/'+fmt(x.qty)+')'}));const invoices=()=>D.invoices.filter(x=>n(x.paid)<n(x.amount)).map(x=>({id:x.id,label:x.number+' — '+x.party+' (due '+fmt(n(x.amount)-n(x.paid))+')'}));
const forms={projects:`${field('name','Project name')}${field('code','Project code')}${field('budget','Approved budget','number','min="0" step="0.01"')}${field('currency','Currency (EUR, AED, INR...)')}`,pos:`${choice('project_id','Project',projects())}${field('supplier','Supplier')}${field('item','Item description')}${field('qty','Ordered quantity','number','min="0.001" step="any"')}${field('unit_price','Unit price','number','min="0" step="0.01"')}`,deliveries:`${choice('po_id','Purchase order',pos())}${field('qty','Quantity received','number','min="0.001" step="any"')}${field('note','Delivery note')}`,certifications:`${choice('po_id','Purchase order',pos())}${field('qty','Quantity certified','number','min="0.001" step="any"')}${field('note','Certification remark')}`,invoices:`<div><label>Invoice type</label><select name="kind" id="kind"><option value="supplier">Supplier invoice (payable)</option><option value="client">Client invoice (receivable)</option></select></div>${choice('po_id','PO for supplier invoice',pos())}${choice('project_id','Project for client invoice',projects())}${field('party','Supplier or client')}${field('amount','Amount','number','min="0.01" step="0.01"')}${field('due_date','Due date','date')}`,payments:`${choice('invoice_id','Unpaid invoice',invoices())}${field('amount','Amount paid / received','number','min="0.01" step="0.01"')}${field('reference','Bank or transaction reference')}`};
const labels={projects:'Projects',pos:'Purchase Orders',deliveries:'Deliveries',certifications:'Certifications',invoices:'Invoices',payments:'Payments & Receipts',documents:'Documents',audit:'Audit History',dashboard:'Overview'};
function table(data,keys){if(!data.length)return '<p class="muted">No records yet.</p>';return `<table><thead><tr>${keys.map(k=>`<th>${esc(k[1])}</th>`).join('')}</tr></thead><tbody>${data.map(r=>`<tr>${keys.map(([k])=>`<td>${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function render(){if(!me)return;const total=D.pos.reduce((s,x)=>s+n(x.qty)*n(x.unit_price),0),due=D.invoices.filter(x=>x.kind==='supplier').reduce((s,x)=>s+n(x.amount)-n(x.paid),0),recv=D.invoices.filter(x=>x.kind==='client').reduce((s,x)=>s+n(x.amount)-n(x.paid),0);root.innerHTML=`<div class="shell"><aside><h2>◈ ProjectFlow</h2>${Object.entries(labels).map(([k,v])=>`<button class="${view===k?'active':''}" data-view="${k}">${esc(v)}</button>`).join('')}</aside><main><div class="top"><div><h1>${esc(labels[view])}</h1><p class="muted">Procurement & finance operations · MVP</p></div><div class="actions"><span class="tag">${esc(me.username)} · ${esc(me.role)}</span><button id="logout">Sign out</button></div></div>${notice}<section id="content">${content(total,due,recv)}</section></main></div>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;notice='';render()});document.getElementById('logout').onclick=async()=>{await api('logout','POST');me=null;auth(false)};let form=document.getElementById('entry');if(form)form.onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(form));try{await api(view,'POST',b);notice='<div class="notice">Record saved successfully.</div>';await refresh()}catch(err){flash(err.message,true)}};document.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>upload(b.dataset.upload,b.dataset.id));}
function content(total,due,recv){if(view==='dashboard')return `<div class="cards"><div class="card"><small>Purchase orders</small><strong>${D.pos.length}</strong></div><div class="card"><small>PO committed value*</small><strong>${fmt(total)}</strong></div><div class="card"><small>Supplier invoices unpaid*</small><strong>${fmt(due)}</strong></div><div class="card"><small>Client invoices unpaid*</small><strong>${fmt(recv)}</strong></div></div><p class="muted">*Unconverted amounts; do not interpret combined totals across currencies.</p><div class="panel"><h3>Recent purchase orders</h3>${table(D.pos.slice(0,8),[['number','PO number'],['supplier','Supplier'],['item','Item'],['qty','Ordered'],['received','Received'],['certified','Certified'],['status','Status']])}</div><div class="panel"><h3>Recent invoices</h3>${table(D.invoices.slice(0,8),[['number','Invoice'],['kind','Type'],['party','Party'],['amount','Amount'],['paid','Paid'],['status','Status']])}</div>`;
if(view==='documents')return `<div class="panel"><h3>Uploaded evidence</h3>${D.documents.map(x=>`<p><a href="/api/documents/${esc(x.id)}">${esc(x.original_name)}</a> — ${esc(x.entity_type)} (${esc(x.entity_id.slice(0,8))})</p>`).join('')||'No documents yet'}</div><div class="panel"><h3>Attach documents</h3><p class="muted">Upload PDFs, PNGs, or JPEGs (10 MB maximum) from the Purchase Orders, Invoices, or Projects tables.</p></div>`;
if(view==='audit')return `<div class="panel">${table(D.audit,[['created_at','When (UTC)'],['actor','User'],['action','Action'],['entity','Entity'],['detail','Detail']])}</div>`;
const cols={projects:[['code','Code'],['name','Project'],['budget','Budget'],['currency','Currency']],pos:[['number','PO'],['supplier','Supplier'],['item','Item'],['qty','Ordered'],['received','Received'],['certified','Certified'],['unit_price','Unit price'],['status','Status']],deliveries:[['po_id','PO ID'],['qty','Quantity'],['note','Note'],['created_at','Date']],certifications:[['po_id','PO ID'],['qty','Quantity'],['note','Remark'],['created_at','Date']],invoices:[['number','Invoice'],['kind','Type'],['party','Party'],['amount','Amount'],['paid','Paid'],['status','Status'],['due_date','Due']],payments:[['invoice_id','Invoice ID'],['amount','Amount'],['reference','Reference'],['created_at','Date']]};const uploadable=['projects','pos','invoices'].includes(view);const allowed={projects:['admin','procurement','manager'],pos:['admin','procurement'],deliveries:['admin','store'],certifications:['admin','certifier'],invoices:['admin','finance'],payments:['admin','finance']};return `${allowed[view]?.includes(me.role)?`<div class="panel"><h3>Add ${esc(labels[view])}</h3><form id="entry"><div class="formgrid">${forms[view]}</div><p><button>Save record</button></p></form></div>`:''}<div class="panel"><h3>Register</h3>${table(D[view],cols[view])}${uploadable&&D[view].length?`<h3>Attach evidence</h3>${D[view].slice(0,30).map(x=>`<p>${esc(x.number||x.code)} <button data-upload="${view==='pos'?'po':view==='invoices'?'invoice':'project'}" data-id="${esc(x.id)}">Upload document</button></p>`).join('')}`:''}</div>`}
async function upload(type,id){let inp=document.createElement('input');inp.type='file';inp.accept='.pdf,.png,.jpg,.jpeg';inp.onchange=async()=>{if(!inp.files[0])return;let f=new FormData();f.append('file',inp.files[0]);try{let r=await fetch('/api/documents/'+type+'/'+id,{method:'POST',body:f});let x=await r.json();if(!r.ok)throw Error(x.detail);notice='<div class="notice">Document uploaded.</div>';await refresh()}catch(e){flash(e.message,true)}};inp.click()}
start();
</script></body></html>
